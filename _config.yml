# Feature List
features                                  :

  - title                                 : Eight Handcrafted Scenes
    description                           : The cell, the kitchen, the library, the laundry, the warden's office, the utility corridor, the old fort's dungeons and the dock.
    fontawesome_icon_name                 : building

  - title                                 : Three Days, Then One Night
    description                           : Gather a tool, the plans and a uniform by day. Then break out in a single night, before the guards come round.
    fontawesome_icon_name                 : moon

  - title                                 : Puzzles With Rules to Figure Out
    description                           : A dumbwaiter to rewire, a relief map to piece together, a laundry chute, a clock's movement, a pontoon in the dark.
    fontawesome_icon_name                 : puzzle-piece

  - title                                 : Characters Who Guide You
    description                           : The Old Man next door, speaking through the wall, the guards and the warden, each with a part to play.
    fontawesome_icon_name                 : comments

  - title                                 : One Hint at a Time
    description                           : A hint matched to where you are in the scene. Never the answer.
    fontawesome_icon_name                 : lightbulb

  - title                                 : First Two Scenes Free
    description                           : Unlock the six others with a single purchase. English and French, no account, no ads.
    fontawesome_icon_name                 : unlock



